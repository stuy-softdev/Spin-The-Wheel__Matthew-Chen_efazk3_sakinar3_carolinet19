<!DOCTYPE html>
<html>
  <head>
    <title>CREATE STORY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="browser-window">
      <div class="header">
        <object data="{{ url_for('static', filename='wheel.pdf') }}" type="application/pdf" class="wheel-icon"></object>
        <h1>Create A Story</h1>
      </div>
      <div class="middle">
        <form action="/new" method="POST">
          <div style="text-align: left; max-width: 700px; margin: 0 auto 15px auto;">
            <label style="color: #c75b9b; font-weight: bold; font-style: italic; font-size: 22px;">Title:</label>
            <input type="text" name="title" style="width: 100%; max-width: 100%; margin-top: 5px;" required>
          </div>
          <div style="text-align: left; max-width: 700px; margin: 0 auto 25px auto;">
            <textarea name="body" rows="8" style="width: 100%; max-width: 100%;" required></textarea>
          </div>
          <input type="submit" value="Submit">
        </form>
      </div>
    </div>
  </body>
</html>
