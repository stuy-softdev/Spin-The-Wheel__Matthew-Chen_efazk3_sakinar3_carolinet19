<!DOCTYPE html>
<html>
  <head>
    <title>REGISTRATION</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="browser-window">
      <div class="header">
        <object data="{{ url_for('static', filename='wheel.pdf') }}" type="application/pdf" class="wheel-icon"></object>
        <h1>REGISTER</h1>
      </div>
      <div class="middle">
        <div style="display: flex; align-items: center; justify-content: space-between; max-width: 700px; margin: 0 auto;">
          <div>
            <form action="/login"><input type="submit" value="Have an Account?"></form>
          </div>
          <form action="/register" method="POST" style="text-align: left;">
            <div style="margin-bottom: 12px;">
              <label style="color: #c75b9b; font-weight: bold; display: inline-block; width: 170px;">Username:</label>
              <input type="text" name="username" required>
            </div>
            <div style="margin-bottom: 12px;">
              <label style="color: #c75b9b; font-weight: bold; display: inline-block; width: 170px;">Password:</label>
              <input type="password" name="password" required>
            </div>
            <div style="margin-bottom: 20px;">
              <label style="color: #c75b9b; font-weight: bold; display: inline-block; width: 170px;">Verify Password:</label>
              <input type="password" name="confirm_password" required>
            </div>
            <div style="text-align: center;">
              <input type="submit" value="Create account">
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
